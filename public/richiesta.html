<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Richiesta — Alternativa Pastry Lab</title>
  <meta name="description" content="Richiedi o ordina dal laboratorio.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Sora:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">
      <strong>Alternativa</strong>
      <span>Pastry Lab</span>
    </a>
    <nav class="nav" aria-label="Principale">
      <a href="/">Home</a>
      <a href="/catalogo.html">Catalogo</a>
      <a href="/chi-sono.html">Chi sono</a>
      <a href="/richiesta.html" aria-current="page">Richiedi <span class="badge" data-richiesta-count hidden>0</span></a>
    </nav>
  </header>

  <main class="wrap page">
    <header class="page-intro">
      <p class="eyebrow">Ordine</p>
      <h1>Richiedi</h1>
      <p class="lede">Scrivi cosa ti serve. Se più avanti aggiungi prodotti al catalogo, le schede scelte compaiono in questa pagina.</p>
    </header>

    <div class="layout">
      <section class="panel">
        <h2>Selezione</h2>
        <div data-righe></div>
      </section>

      <form class="form" data-richiesta-form>
        <div class="row">
          <label>Nome
            <input name="nome" autocomplete="name" required maxlength="80">
          </label>
          <label>Email
            <input name="email" type="email" autocomplete="email" required maxlength="120">
          </label>
        </div>
        <div class="row">
          <label>Telefono
            <input name="telefono" type="tel" autocomplete="tel" maxlength="40">
          </label>
          <label>Quando
            <input name="data" type="date">
          </label>
        </div>
        <label>Modalità
          <select name="modalita">
            <option value="ritiro">Ritiro</option>
            <option value="da-concordare">Da concordare</option>
          </select>
        </label>
        <label>Messaggio
          <textarea name="messaggio" required maxlength="2000" placeholder="Dolce, quantità, allergie, orario."></textarea>
        </label>
        <button class="button" type="submit">Invia richiesta</button>
        <p data-status role="status"></p>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <span>Alternativa Pastry Lab</span>
    <span>© <span data-year></span></span>
  </footer>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
